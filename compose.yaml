services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: go_history
      POSTGRES_DB: go_history
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_history -d go_history"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
volumes:
  postgres_data:
